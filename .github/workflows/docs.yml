# Docs CI — catches docs rot before it merges.
# Copyright (c) 2026 Ramin Allazov (JavaAZE). All Rights Reserved.
#
# What this workflow enforces:
#   1. `mkdocs build --strict` succeeds — no broken internal links,
#      no missing nav entries, no orphan pages, no Material warnings.
#   2. `lychee` finds no dead external URLs in the docs/ markdown.
#
# Why strict mode is the gate:
#   Story 3.1 hardened the supervisor HTTP contract and the docs/
#   reference page is meant to stay in lock-step with it. Without
#   strict mode, a docs edit that silently breaks a link (e.g. renames
#   a concept page without updating the ADR referencing it) would merge.
#
# Triggers: PRs that touch any docs input, and pushes to main.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - ".lychee.toml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - ".lychee.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mkdocs strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          retention-days: 7
          if-no-files-found: error

  link-check:
    name: lychee link check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # We check the markdown source, not the built site, because internal
      # links are already validated by `mkdocs build --strict`. This job is
      # specifically about external URL health — the markdown is the source
      # of truth humans actually edit.
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --no-progress
            --verbose
            docs/**/*.md
            README.md
          fail: true
