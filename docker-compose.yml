version: '3.9'
services:
  dirijor-supervisor:
    build: ./backend/dirijor-core
    ports: ["8000:8000"]
    # Optional Story 4.1 semantic cache — point at local Qdrant when profile `qdrant` is enabled:
    # environment:
    #   - QDRANT_URL=http://qdrant:6333
  grok-agent:
    build: ./backend/openclaw-wrapper
    environment:
      - HEADSCALE_URL=your-headscale-control-plane
      - REALM_NAME=finance-swarm-001
    depends_on: [dirijor-supervisor]
  harper-security:
    build: ./backend/openclaw-wrapper
    environment:
      - HEADSCALE_URL=your-headscale-control-plane

  # Optional local Qdrant for verified semantic cache (Story 4.1). Supervisor stays healthy
  # without it. Production: use private networking, API keys, and TLS (Qdrant security guide).
  qdrant:
    profiles: ["qdrant"]
    image: qdrant/qdrant:v1.12.4
    ports: ["127.0.0.1:6333:6333"]
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
