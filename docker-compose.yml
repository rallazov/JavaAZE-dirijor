version: '3.9'
services:
  dirijor-supervisor:
    build: ./backend/dirijor-core
    ports: ["8000:8000"]
    # Optional Story 6.1 OTLP (HTTP) — point at a local collector when you run one:
    # environment:
    #   - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    #   - OTEL_SERVICE_NAME=dirijor-core
    # Optional Story 4.1 semantic cache — point at local Qdrant when profile `qdrant` is enabled:
    # environment:
    #   - QDRANT_URL=http://qdrant:6333
  grok-agent:
    build: ./backend/openclaw-wrapper
    environment:
      - HEADSCALE_URL=your-headscale-control-plane
      - REALM_NAME=finance-swarm-001
      # Optional Story 6.1 — same collector as supervisor if desired:
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      # - OTEL_SERVICE_NAME=dirijor-openclaw-wrapper
      # Story 5.2 — application-layer tool allowlist + egress stub (empty/missing allowlist = deny all tools)
      # - DIRIJOR_TOOL_ALLOWLIST=noop,internal_lookup
      # - DIRIJOR_EGRESS_MODE=deny_public
      # - DIRIJOR_WRAPPER_POLICY_PATH=/etc/dirijor/wrapper-policy.json
    depends_on: [dirijor-supervisor]
  harper-security:
    build: ./backend/openclaw-wrapper
    environment:
      - HEADSCALE_URL=your-headscale-control-plane
      # Story 5.2 — wire the same policy vars as grok-agent when you split tool surfaces per realm

  # Optional local Qdrant for verified semantic cache (Story 4.1). Supervisor stays healthy
  # without it. Production: use private networking, API keys, and TLS (Qdrant security guide).
  qdrant:
    profiles: ["qdrant"]
    image: qdrant/qdrant:v1.12.4
    ports: ["127.0.0.1:6333:6333"]
    volumes:
      - qdrant_storage:/qdrant/storage

  # --- Optional local observability (Story 6.2): OTLP collector → Tempo → Grafana.
  # Run: docker compose --profile observability up -d
  # Point Core / wrapper at the collector (HTTP OTLP): OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector:0.96.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./ops/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:4317:4317"
    depends_on: [tempo]

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.3.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./ops/observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:10.4.5
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Override on shared machines: GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./ops/observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./docs/observability/grafana:/var/lib/grafana/dashboards/dirijor:ro
    depends_on: [tempo]

volumes:
  qdrant_storage:
